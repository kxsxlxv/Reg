# VTR — Vision To Reg. One output = one self-contained block.
# Change styles here; the program that produces an output is not part of its identity.
# format is the TOML contract version. A hash of this file identifies its exact contents.
format = 1

# outline_width: added thickness on each side; outline_color: #RRGGBB.
# outline_alpha: 0 = invisible, 1 = opaque. Width 0 disables the outline.

[defaults.label]
place = "top_left_outside"
color = "auto"
background = "box_color"
background_alpha = 1.0
font_px = 14
padding_px = 3
gap_px = 0
rounding_px = 0

# Independent detections — each can feed a supervisor, MOT or SOT.

[output.neural_detection]
id = 1
semantic = "detection"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 30
box = { color = "#F5C542", edges = "solid", edge_width = 2, outline_width = 0.6, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
label = { show = true, text = "NN {conf_pct}%" }

[output.canny_detection]
id = 2
semantic = "detection"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 31
box = { color = "#32D5E8", edges = "solid", edge_width = 1, edge_markers = "center", marker_width = 3, marker_px = 12, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
label = { show = false, text = "Canny" }

[output.motion_detection]
id = 3
semantic = "detection"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 32
box = { color = "#FF8E40", edges = "none", corners = "solid", corner_width = 2.5, corner_px = 13, fill_alpha = 0.13, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }

# Operator-only extrapolation between neural detector updates (~20 Hz on 60 FPS).
# No outline and no label; intentionally not included in benchmark.
[output.linear_propagation]
id = 4
semantic = "propagation"
geometry = "bbox"
benchmark = "none"
visible = true
z_order = 20
box = { fill = "#32A8FF", fill_alpha = 0.22, edges = "none" }

# Sky/Canny and independent motion.

[output.sky_mask]
id = 10
semantic = "sky"
geometry = "mask"
benchmark = "sky_mask_iou"
visible = true
z_order = 10
osd = { color = "#408CFF", alpha = 0.25 }

[output.canny_contours]
id = 11
semantic = "contour"
geometry = "polyline"
benchmark = "none"
visible = true
z_order = 25
osd = { color = "#32D5E8", width = 2, pattern = "solid" }

[output.motion_mask]
id = 12
semantic = "motion"
geometry = "mask"
benchmark = "none"
visible = true
z_order = 12
osd = { color = "#FF8E40", alpha = 0.35 }

# Supervisor decisions are separate from the candidate sources.

[output.supervisor_accepted]
id = 20
semantic = "detection"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 36
box = { color = "#F2F2F2", edges = "none", corners = "solid", corner_width = 4, corner_px = 18, outline_width = 0.8, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
label = { show = false, text = "ACCEPT {origin}" }

[output.supervisor_rejected]
id = 21
semantic = "rejected"
geometry = "bbox"
benchmark = "none"
visible = true
z_order = 35
box = { color = "#8F9299", edges = "solid", edge_width = 1.5, diagonals = "solid", diagonal_width = 1.5, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }

# MOT states and propagated geometry are not tied to TrackTrack or Kalman.

[output.mot_track]
id = 30
semantic = "tracking"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 42
box = { color = "#28DF7D", edges = "solid", edge_width = 1.5, corners = "solid", corner_width = 3.5, corner_px = 15, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
label = { show = true, text = "MOT #{track_id}" }

[output.mot_prediction]
id = 31
semantic = "prediction"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 40
box = { color = "#28DF7D", edges = "dashed", dash_px = 7, gap_px = 5, edge_width = 2, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }

[output.mot_ofa]
id = 32
semantic = "propagation"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 41
box = { color = "#28DF7D", edges = "dash_dot", dash_px = 10, gap_px = 4, dot_px = 2, edge_width = 2, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }

# SOT and its auxiliary search ROI.

[output.sot_track]
id = 40
semantic = "tracking"
geometry = "bbox"
benchmark = "bbox_iou"
visible = true
z_order = 50
box = { color = "#E966FF", edges = "dashed", edge_width = 1.5, corners = "solid", corner_width = 4, corner_px = 20, outline_width = 0.8, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
label = { show = false, text = "SOT #{track_id}" }

[output.sot_search_roi]
id = 41
semantic = "search_region"
geometry = "bbox"
benchmark = "none"
visible = true
z_order = 45
box = { color = "#AD8BFF", edges = "dashed", edge_width = 1.5, rounding_px = 8, outline_width = 0.5, outline_color = "#0C1014", outline_alpha = 1.0, adaptive = true }
