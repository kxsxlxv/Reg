name: core-tests

on:
  push:
    branches:
      - master
      - mvp/**
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core-only build
        run: cmake -S . -B build -DREG_BUILD_PROBE=OFF -DREG_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
