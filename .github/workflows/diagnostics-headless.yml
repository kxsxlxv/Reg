name: Diagnostics headless

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostics-headless.yml'
      - 'src/diagnostics/**'
      - 'src/media/FrameIdentity.hpp'
      - 'src/metadata/FrameMetadata.hpp'
      - 'tools/diagnostic_scenarios/**'
      - 'tests/diagnostic_statistics_tests.cpp'
      - 'tests/exact_sync_diagnostics_tests.cpp'
      - 'tests/diagnostic_fixture_bridge.cpp'
      - 'tests/diagnostic_api_contract_tests.cpp'
      - 'tests/diagnostic_runtime_v1_tests.cpp'
      - 'tests/diagnostic_telemetry_adapter_tests.cpp'
      - 'tests/diagnostic_api_codec_tests.cpp'
      - 'tests/diagnostic_http_transport_tests.cpp'
      - 'tests/fixtures/diagnostics/**'
      - 'src/telemetry/GtRangeHistory.hpp'
      - 'src/telemetry/TelemetryModel.cpp'
      - 'src/telemetry/TelemetryModel.hpp'
      - 'tests/gt_range_history_tests.cpp'
      - 'src/render/Cvm1SemanticStyle.hpp'
      - 'src/telemetry/GtRangeHistory.hpp'
      - 'tests/cvm1_semantic_style_tests.cpp'
      - 'CMakeLists.txt'
  push:
    branches:
      - 'feat/**'
      - 'test/**'
    paths:
      - '.github/workflows/diagnostics-headless.yml'
      - 'src/diagnostics/**'
      - 'src/media/FrameIdentity.hpp'
      - 'src/metadata/FrameMetadata.hpp'
      - 'tools/diagnostic_scenarios/**'
      - 'tests/diagnostic_statistics_tests.cpp'
      - 'tests/exact_sync_diagnostics_tests.cpp'
      - 'tests/diagnostic_fixture_bridge.cpp'
      - 'tests/fixtures/diagnostics/**'
      - 'src/telemetry/GtRangeHistory.hpp'
      - 'src/telemetry/TelemetryModel.cpp'
      - 'src/telemetry/TelemetryModel.hpp'
      - 'tests/gt_range_history_tests.cpp'
      - 'src/render/Cvm1SemanticStyle.hpp'
      - 'src/telemetry/GtRangeHistory.hpp'
      - 'tests/cvm1_semantic_style_tests.cpp'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  pure-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Reg sources without media submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run Python fixture generator and oracle unit tests
        run: python3 -m unittest discover -s tools/diagnostic_scenarios -p 'test_lab.py' -v

      - name: Build headless C++ test programs
        run: |
          mkdir -p build-headless
          flags='-std=c++23 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -pthread -Isrc'
          g++ $flags tests/diagnostic_statistics_tests.cpp -o build-headless/reg_diag_stats
          g++ $flags tests/exact_sync_diagnostics_tests.cpp -o build-headless/reg_diag_sync
          g++ $flags tests/diagnostic_fixture_bridge.cpp -o build-headless/reg_diag_bridge
          g++ $flags tests/diagnostic_api_contract_tests.cpp -o build-headless/reg_diag_api_contract
          g++ $flags tests/gt_range_history_tests.cpp -o build-headless/reg_gt_range_history
          g++ $flags tests/cvm1_semantic_style_tests.cpp -o build-headless/reg_cvm1_semantics
          g++ $flags tests/telemetry_model_tests.cpp src/telemetry/TelemetryModel.cpp -o build-headless/reg_telemetry_model

      - name: Execute C++ statistical and Exact Sync regressions
        run: |
          ./build-headless/reg_diag_stats
          ./build-headless/reg_diag_sync
          ./build-headless/reg_diag_api_contract
          ./build-headless/reg_gt_range_history
          ./build-headless/reg_cvm1_semantics
          ./build-headless/reg_telemetry_model

      - name: Verify B fixture oracle through A and C C++ implementations
        run: python3 -m tools.diagnostic_scenarios.test_cpp_integration ./build-headless/reg_diag_bridge


      - name: Compile Phase-2 Reg Diagnostic API without FFmpeg/Vulkan
        run: |
          flags='-std=c++23 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -pthread -Isrc'
          g++ $flags tests/diagnostic_telemetry_adapter_tests.cpp -o build-headless/reg_diag_adapter
          g++ $flags src/diagnostics/api/codec/DiagnosticJsonApi.cpp tests/diagnostic_api_codec_tests.cpp -o build-headless/reg_diag_codec
          g++ $flags src/diagnostics/api/transport/LoopbackHttpServer.cpp tests/diagnostic_http_transport_tests.cpp -o build-headless/reg_diag_http
          g++ $flags src/telemetry/TelemetryModel.cpp \
            src/diagnostics/api/codec/DiagnosticJsonApi.cpp \
            src/diagnostics/api/transport/LoopbackHttpServer.cpp \
            src/diagnostics/api/runtime/DiagnosticRuntime.cpp \
            tests/diagnostic_runtime_v1_tests.cpp -o build-headless/reg_diag_runtime

      - name: Test standalone and full real-counter HTTP pipeline
        run: |
          ./build-headless/reg_diag_adapter
          ./build-headless/reg_diag_codec
          ./build-headless/reg_diag_http
          ./build-headless/reg_diag_runtime
