name: Windows build

on:
  push:
    branches:
      - master
      - mvp/**
      - feat/**
    tags:
      - v*
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false # Keep the prior build/test result while a new push queues

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
      CCACHE_MAXSIZE: 600M
      CCACHE_COMPRESS: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc

      # Reuse FFmpeg for code-only edits. The key includes workflow flags.
      # ccache survives ephemeral GitHub runners. A unique key writes updated
      # entries while restore-keys picks the newest prior compiler cache.
      - name: Restore C++ compiler cache
        uses: actions/cache@v4
        with:
          path: .ci/ccache
          key: win-ucrt64-ccache-v1-${{ github.sha }}
          restore-keys: |
            win-ucrt64-ccache-v1-

      - name: Reset compiler cache counters
        shell: msys2 {0}
        run: ccache --zero-stats

      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: .ci/ffmpeg-install
          key: ucrt64-ffmpeg-v1-${{ hashFiles('ffmpeg/configure', 'ffmpeg/libavcodec/version_major.h') }}

      - name: Build FFmpeg libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          FFMPEG_PREFIX="$PWD/.ci/ffmpeg-install"
          mkdir -p "$PWD/.ci/ffmpeg-build"
          cd "$PWD/.ci/ffmpeg-build"

          PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig \
          CFLAGS="-I/ucrt64/include" \
          CPPFLAGS="-I/ucrt64/include" \
          LDFLAGS="-L/ucrt64/lib" \
          "$GITHUB_WORKSPACE/ffmpeg/configure" \
            --prefix="$FFMPEG_PREFIX" \
            --disable-programs --disable-doc \
            --enable-shared --disable-static \
            --disable-avdevice --disable-avfilter \
            --disable-swscale --disable-swresample \
            --disable-encoders --disable-muxers \
            --enable-muxer=matroska \
            --disable-decoders --enable-decoder=h264 \
            --enable-hwaccel=h264_vulkan --enable-vulkan

          grep -E '^#define CONFIG_H264_VULKAN_HWACCEL 1$' config_components.h
          make -j2
          make install

      - name: Verify MSYS2 compiler cache
        shell: msys2 {0}
        run: |
          mkdir -p .ci
          echo 'int ccache_smoke() { return 7; }' > .ci/ccache-smoke.cpp
          ccache g++ -std=c++23 -c .ci/ccache-smoke.cpp -o .ci/ccache-smoke.o
          ccache g++ -std=c++23 -c .ci/ccache-smoke.cpp -o .ci/ccache-smoke.o
          ccache --show-stats --verbose

      - name: Configure project
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFFMPEG_ROOT="$PWD/.ci/ffmpeg-install" \
            -DREG_ENABLE_VALIDATION=OFF \
            -DREG_BUILD_TESTS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DREG_ENABLE_NETIMGUI_REMOTE=ON \
            -DVulkan_INCLUDE_DIR=/ucrt64/include \
            -DVulkan_LIBRARY=/ucrt64/lib/libvulkan-1.dll.a

      - name: Build application
        shell: msys2 {0}
        run: cmake --build build-win --parallel 3

      - name: C++ compiler cache statistics
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats --verbose

      - name: Check standalone Windows updater dependencies
        shell: msys2 {0}
        run: |
          objdump -p build-win/reg_updater.exe | grep 'DLL Name:'
          if objdump -p build-win/reg_updater.exe |
              grep -iE 'DLL Name:.*(libstdc\\+\\+|libgcc|libwinpthread)'; then
            echo "Updater must not depend on application-shipped MinGW DLLs"
            exit 1
          fi

      - name: Run C++ tests
        shell: msys2 {0}
        run: |
          export PATH="$PWD/.ci/ffmpeg-install/bin:$PATH"
          ctest --test-dir build-win --output-on-failure

      - name: Deploy Windows runtime DLLs
        shell: msys2 {0}
        run: |
          cmake \
            "-DREG_BUILD_DIR=$(cygpath -m "$PWD/build-win")" \
            "-DREG_FFMPEG_BIN=$(cygpath -m "$PWD/.ci/ffmpeg-install/bin")" \
            "-DREG_UCRT_BIN=$(cygpath -m /ucrt64/bin)" \
            -P cmake/DeployWindowsRuntime.cmake

      - name: Test manifest packager
        shell: pwsh
        run: python scripts/windows/test_package_update.py

      - name: Create delta assets and portable bundle
        shell: pwsh
        env:
          # A single migration commit can omit the already-installed MinGW
          # DLL containing '+'. Later updates use the corrected validator.
          LEGACY_UPDATE_BRIDGE: ${{ contains(github.event.head_commit.message, '[legacy-bridge]') }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $channel = "stable"
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $channel = "dev"
            $tag = "dev-$env:GITHUB_SHA"
          }
          $extra = @()
          if ($env:LEGACY_UPDATE_BRIDGE -eq "true" -and $channel -eq "dev") {
            $extra += "--bridge-legacy-updater"
          }
          python scripts/windows/package-update.py --root build-win --out dist --channel $channel --tag $tag @extra
          if ($LASTEXITCODE -ne 0) { throw "Package creation failed" }

      - name: Upload initial portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/portable.zip
            dist/manifest.json
          if-no-files-found: error

      # PRs are tested but never publish executable updates.
      - name: Publish update to GitHub Releases
        if: >-
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/heads/master') ||
           startsWith(github.ref, 'refs/heads/mvp/') ||
           startsWith(github.ref, 'refs/heads/feat/') ||
           startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $channel = "stable"
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $channel = "dev"
            $tag = "dev-$env:GITHUB_SHA"
          }
          $repo = $env:GITHUB_REPOSITORY
          $files = @("dist/manifest.json", "dist/portable.zip") + @(Get-ChildItem dist/assets -File | ForEach-Object { $_.FullName })
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo $repo
          } elseif ($channel -eq "dev") {
            gh release create $tag $files --repo $repo --target $env:GITHUB_SHA --prerelease --title "Development $($env:GITHUB_SHA.Substring(0, 9))" --notes "Automated verified Windows build. Individual files enable delta updates."
          } else {
            gh release create $tag $files --repo $repo --verify-tag --title "Windows $tag" --notes "Stable Windows portable build with in-app updates."
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
