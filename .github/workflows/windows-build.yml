name: Windows build

on:
  push:
    branches:
      - master
      - mvp/**
      - feat/**
  pull_request:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc

      - name: Build FFmpeg libraries
        shell: msys2 {0}
        run: |
          FFMPEG_PREFIX="$PWD/.ci/ffmpeg-install"
          mkdir -p "$PWD/.ci/ffmpeg-build"
          cd "$PWD/.ci/ffmpeg-build"

          PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig           CFLAGS="-I/ucrt64/include"           CPPFLAGS="-I/ucrt64/include"           LDFLAGS="-L/ucrt64/lib"           "$GITHUB_WORKSPACE/ffmpeg/configure"             --prefix="$FFMPEG_PREFIX"             --disable-programs             --disable-doc             --enable-shared             --disable-static             --disable-avdevice             --disable-avfilter             --disable-swscale             --disable-swresample             --disable-encoders             --disable-muxers             --enable-muxer=matroska             --disable-decoders             --enable-decoder=h264             --enable-hwaccel=h264_vulkan             --enable-vulkan

          grep -E '^#define CONFIG_H264_VULKAN_HWACCEL 1$' config_components.h

          make -j2
          make install

      - name: Configure Reg
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win -G Ninja             -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DFFMPEG_ROOT="$PWD/.ci/ffmpeg-install"             -DREG_ENABLE_VALIDATION=OFF             -DREG_BUILD_TESTS=ON             -DREG_ENABLE_NETIMGUI_REMOTE=ON             -DVulkan_INCLUDE_DIR=/ucrt64/include             -DVulkan_LIBRARY=/ucrt64/lib/libvulkan-1.dll.a

      - name: Build Reg
        shell: msys2 {0}
        run: cmake --build build-win --verbose

      - name: Run unit tests
        shell: msys2 {0}
        run: |
          export PATH="$PWD/.ci/ffmpeg-install/bin:$PATH"
          ctest --test-dir build-win --output-on-failure


      - name: Deploy double-click runtime
        shell: msys2 {0}
        run: |
          cmake \
            "-DREG_BUILD_DIR=$(cygpath -m "$PWD/build-win")" \
            "-DREG_FFMPEG_BIN=$(cygpath -m "$PWD/.ci/ffmpeg-install/bin")" \
            "-DREG_UCRT_BIN=$(cygpath -m /ucrt64/bin)" \
            -P cmake/DeployWindowsRuntime.cmake

      - name: Upload Windows launcher bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: |
            build-win/reg_launcher.exe
            build-win/reg_probe.exe
            build-win/reg_replay.exe
            build-win/*.dll
            build-win/fonts/
            build-win/shaders/
